# ==============================================================================
# Hardened PostgreSQL 17.11+ Configuration (portal-db & authentik-db)
# ==============================================================================
listen_addresses = '*'
port = 5432

# Sized to 200 for Authentik 2025.10+ (post-Redis removal increases connections ~50%)
max_connections = 200
superuser_reserved_connections = 5

# Memory & WAL settings (CVE-2026-6471 mitigation: logical decoding disabled)
shared_buffers = 64MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_level = replica
max_wal_senders = 0
max_replication_slots = 0

# Authentication & Security
password_encryption = 'scram-sha-256'
row_security = on
ssl = off

# Statement & Idle Timeouts (DoS protection)
statement_timeout = 15000
lock_timeout = 5000
idle_in_transaction_session_timeout = 10000

# Audit Logging (no literal passwords logged)
log_destination = 'stderr'
logging_collector = off
log_connections = on
log_disconnections = on
log_Error_verbosity = default
log_statement = 'ddl'
log_min_duration_statement = 1000
