<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>portaX — {{.Code}} {{.Title}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card" style="max-width:560px; margin:5rem auto; padding:1.75rem;">
      <div class="card-top">
        <div class="card-identity">
          <div class="service-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <div>
            <div class="card-category">Security Gateway</div>
            <div class="card-title">{{.Code}} — {{.Title}}</div>
          </div>
        </div>
      </div>

      <div class="card-desc" style="font-size:0.92rem;">{{.Message}}</div>

      {{if .ShowLogout}}
        <div style="display:flex; flex-direction:column; gap:0.75rem; border-top:1px solid var(--border); padding-top:1.1rem; margin-top:0.5rem;">
          <a class="btn btn-danger" style="justify-content:center; padding:0.65rem 1rem; font-weight:600;" href="https://auth.alsa.web.id/logout-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
            Sign Out Completely (All Services: Authentik + Cloudflare Access)
          </a>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.65rem;">
            <a class="btn" style="justify-content:center;" href="https://auth.alsa.web.id/logout-sso">
              Switch SSO Account
            </a>
            <a class="btn btn-primary" style="justify-content:center;" href="/auth/login">
              Sign In to Portal
            </a>
          </div>
        </div>
      {{else}}
        <div class="card-meta">
          <a class="btn" href="/">← Back to Portal</a>
        </div>
      {{end}}
    </div>
  </div>
</body>
</html>
